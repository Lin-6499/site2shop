mutation Phase5PagePublishBatch($id0: ID!, $id1: ID!, $id2: ID!, $id3: ID!, $id4: ID!, $id5: ID!, $id6: ID!, $id7: ID!, $id8: ID!, $id9: ID!) {
  publish0: pageUpdate(id: $id0, page: {isPublished: true}) { page { id handle isPublished } userErrors { field message code } }
  publish1: pageUpdate(id: $id1, page: {isPublished: true}) { page { id handle isPublished } userErrors { field message code } }
  publish2: pageUpdate(id: $id2, page: {isPublished: true}) { page { id handle isPublished } userErrors { field message code } }
