  publish4: pageUpdate(id: $id4, page: {isPublished: true}) { page { id handle isPublished } userErrors { field message code } }
  publish5: pageUpdate(id: $id5, page: {isPublished: true}) { page { id handle isPublished } userErrors { field message code } }
  publish6: pageUpdate(id: $id6, page: {isPublished: true}) { page { id handle isPublished } userErrors { field message code } }
  publish7: pageUpdate(id: $id7, page: {isPublished: true}) { page { id handle isPublished } userErrors { field message code } }
  publish8: pageUpdate(id: $id8, page: {isPublished: true}) { page { id handle isPublished } userErrors { field message code } }
  publish9: pageUpdate(id: $id9, page: {isPublished: true}) { page { id handle isPublished } userErrors { field message code } }
}
